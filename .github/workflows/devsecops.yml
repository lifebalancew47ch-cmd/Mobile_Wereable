name: DevSecOps Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  secret-scanning:
    name: "🔑 Gitleaks — Secret Detection"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast-flutter:
    name: "🔬 SAST — Dart/Flutter Analysis"
    runs-on: ubuntu-latest
    needs: secret-scanning
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Create environment placeholder files
        run: |
          touch .env.development
          touch .env.production
      - run: flutter pub get
      - run: flutter analyze --fatal-warnings

  sast-android:
    name: "🛡️ SAST — Android/Kotlin Linting"
    runs-on: ubuntu-latest
    needs: secret-scanning
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Generate local.properties
        run: flutter pub get
      - name: Run Android Lint
        run: cd android && ./gradlew lintDebug

  sca-dependencies:
    name: "📦 Trivy — Dependency CVE Scan"
    runs-on: ubuntu-latest
    needs: secret-scanning
    steps:
      - uses: actions/checkout@v4
      - name: Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

  tests:
    name: "🧪 Flutter Unit Tests"
    runs-on: ubuntu-latest
    needs: [sast-flutter, sast-android, sca-dependencies]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter pub get
      - run: flutter test

  build-mobile:
    name: "📱 Build Mobile APK"
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

  build-wear:
    name: "⌚ Build Wear OS APK"
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - run: cd android && ./gradlew :wear:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: wear-debug-apk
          path: android/wear/build/outputs/apk/debug/wear-debug.apk
