name: DevSecOps Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  secret-scanning:
    name: "🔑 Gitleaks — Secret Detection"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast-flutter:
    name: "🔬 SAST — Dart/Flutter Analysis"
    runs-on: ubuntu-latest
    needs: secret-scanning
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Create environment placeholder files
        run: |
          touch .env.development
          touch .env.production
      - run: flutter pub get
      - run: flutter analyze --fatal-warnings

  # Job único de lint Android/Kotlin (antes había dos jobs duplicados,
  # sast-android + android-lint). Uno solo, sin `|| true` para que un fallo
  # de lint rompa el pipeline en lugar de enmascararse.
  android-lint:
    name: "🤖 SAST — Android/Kotlin Linting"
    runs-on: ubuntu-latest
    needs: secret-scanning
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Create environment placeholder files
        run: |
          touch .env.development
          touch .env.production
      - name: Install dependencies
        run: flutter pub get
      - name: Run Android Lint
        run: cd android && ./gradlew lintDebug --no-configuration-cache
      - name: Upload Lint Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-results
          path: |
            android/**/build/reports/lint-results-*.html
            android/**/build/reports/lint-results-*.xml

  sca-dependencies:
    name: "📦 Trivy — Dependency CVE Scan + SBOM"
    runs-on: ubuntu-latest
    needs: secret-scanning
    steps:
      - uses: actions/checkout@v4
      # Anclado a un SHA de commit inmutable (no a @master) tras el ataque
      # supply-chain de 2026 a los tags de trivy-action. v0.36.0, commit
      # ed142fd0673e97e23eac54620cfb913e5ce36c25 (firma verificada).
      - name: Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
      - name: Generar SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'cyclonedx'
          output: 'sbom.json'
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.json

  tests:
    name: "🧪 Flutter Unit Tests"
    runs-on: ubuntu-latest
    needs: [sast-flutter, android-lint, sca-dependencies]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter pub get
      - name: Create environment placeholder files
        run: |
          touch .env.development
          touch .env.production
      - run: flutter test

  build-mobile:
    name: "📱 Build APK (debug + release)"
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - run: flutter pub get
      - name: Create environment placeholder files
        run: |
          touch .env.development
          touch .env.production
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Generar keystore de release efímera para CI
        run: |
          keytool -genkey -v -keystore android/ci-release.jks \
            -keyalg RSA -keysize 2048 -validity 10000 -alias lifebalance \
            -storepass ci_release_pass -keypass ci_release_pass \
            -dname "CN=LifeBalance CI,O=LifeBalance,C=MX"
          echo "storePassword=ci_release_pass" > android/key.properties
          echo "keyPassword=ci_release_pass" >> android/key.properties
          echo "keyAlias=lifebalance" >> android/key.properties
          echo "storeFile=../ci-release.jks" >> android/key.properties
      - run: flutter build apk --release
      - name: Verificar que el release NO está firmado con debug keystore
        run: |
          if jarsigner -verify -verbose -certs build/app/outputs/flutter-apk/app-release.apk 2>&1 | grep -q "CN=Android Debug"; then
            echo "::error::APK release firmado con la keystore de debug (C-03)"
            exit 1
          fi
          echo "✅ APK release firmado con keystore propia (CI)"
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

  build-wear:
    name: "⌚ Build Wear OS APK"
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Create environment placeholder files
        run: |
          touch .env.development
          touch .env.production
      - name: Install dependencies
        run: flutter pub get
      - run: cd android && ./gradlew :wear:assembleDebug --no-configuration-cache
      - uses: actions/upload-artifact@v4
        with:
          name: wear-debug-apk
          path: android/wear/build/outputs/apk/debug/wear-debug.apk